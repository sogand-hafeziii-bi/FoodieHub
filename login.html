<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به رستوران شهرزاد</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <h1>خوش آمدید به رستوران <span>شهرزاد</span></h1>
    <p>لطفا وارد حساب کاربری خود شوید</p>
    
    <form action="index.html" method="get">
      <label for="username">نام کاربری:</label>
      <input type="text" id="username" name="username" placeholder="نام کاربری خود را وارد نمایید" required>

      <label for="password">رمز:</label>
      <input type="password" id="password" name="password" placeholder="رمز خود را وارد نمایید" required>

      <button type="submit">ورود</button>
    </form>

    <!-- Link to the sign-up page -->
    <p>حساب کاربری ندارید؟ <a href="signup.html">ثبت نام </a></p>
  </div>
</body>
</html>
